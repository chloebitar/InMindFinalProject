<header class="header">
  <div class="header-container">


    <div class="left">
      <h1 class="logo" [routerLink]="['/']" >Chloe</h1>
    </div>

<div class="center">
  <nav class="nav-tabs">

    <button class="tab" [routerLink]="['/products']" [queryParams]="{ cat: 'electronics' }">Electronics</button>
    <button class="tab" [routerLink]="['/products']" [queryParams]="{ cat: 'jewelery' }">Jewelery</button>
    <button class="tab" [routerLink]="['/products']" [queryParams]="{ cat: 'clothing' }">Clothing</button>

  </nav>
</div>

    <div class="right">
      <img src="assets/icons/search.svg" alt="search" class="icon" />
      <img src="assets/icons/profile.svg" alt="profile" class="icon" />
      <div class="cart-wrapper">
  <img src="assets/icons/cart.svg" class="icon" [routerLink]="['/cart']" />
  @if (cart.totalItems() > 0) {
  <span class="cart-badge">{{ cart.totalItems() }}</span>}
</div>
    </div>

  </div>
</header>
