<div class="account-page">

  @if (user(); as u) {

    <div class="account-header">
      <h1>My Account</h1>
      <p>Manage your profile and view your orders</p>
    </div>

    <div class="account-layout">

      <div class="profile-card">

        <div class="avatar">
          {{ initials() }}
        </div>

        <h3 class="name">
          {{ u.firstName }} {{ u.lastName }}
        </h3>

        <p class="username">
          @{{ u.username }}
        </p>

        <div class="contact">
          <p>{{ u.email }}</p>
        </div>

      </div>

      <div class="details-card">

        <h2>Personal Information</h2>
        <p class="sub">Your account details</p>

        <div class="form-grid">

          <div class="form-group">
            <label>First Name</label>
            <input type="text" [value]="u.firstName" >
          </div>

          <div class="form-group">
            <label>Last Name</label>
            <input type="text" [value]="u.lastName" >
          </div>

          <div class="form-group full">
            <label>Email</label>
            <input type="email" [value]="u.email" >
          </div>

          <div class="form-group full">
            <label>Username</label>
            <input type="text" [value]="u.username" >
          </div>

        </div>

      </div>

    </div>

  } 

</div>
